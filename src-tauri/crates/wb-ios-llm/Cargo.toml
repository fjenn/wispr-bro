# SPDX-License-Identifier: GPL-3.0-or-later
#
# llama.cpp b11624 in process, for the iPhone app (iOS cannot start the
# `llama-server` sidecar the Mac uses). The server's own request code is
# linked in and called directly, so prompts, schema, sampling, prompt cache
# and replies are the sidecar's. See README.md.

[package]
name = "wb-ios-llm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"
links = "wb_ios_llm"

[lib]
path = "src/lib.rs"

# Not a member of any workspace yet (README "Integration").
[workspace]

[dependencies]

[dev-dependencies]
# examples/eval.rs: the app's prompt builder and guard chain, compiled from
# src-tauri/src/fork/llm/ unchanged; versions as in src-tauri/Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"
unicode-segmentation = "1"
whatlang = "0.16"
strsim = "0.11"
isolang = "2"
# examples/coexist.rs: both ggml copies in one binary.
transcribe-cpp = { version = "0.4.0", default-features = false, features = ["metal"] }

# tests/listener.rs: the app's HTTP client stack against the listener.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "time"] }

[profile.dev]
opt-level = 1
