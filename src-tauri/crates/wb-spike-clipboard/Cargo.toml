# SPDX-License-Identifier: GPL-3.0-or-later
#
# RS-05 clipboard fidelity and paste hygiene spike (R5 §7 RS-05, §4 W-07,
# S-04, S-06). A test tool, not product code: it is never built into the
# app. src/clip/ is the prototype of fork/clipboard/ that S-04 lifts; the
# rest guides the owner through the RS-05 matrix. See
# docs/fork/spikes/RS-05-procedure.md.

[package]
name = "wb-spike-clipboard"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

# Its own workspace root, so it never joins (or changes) the app's build.
[workspace]

[[bin]]
name = "wb-spike-clipboard"
path = "src/main.rs"

# The app's own versions (src-tauri/Cargo.lock); Cargo.lock is a pruned copy
# of src-tauri/Cargo.lock, so nothing new is downloaded.
[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
png = "0.18"
signal-hook = "0.3.18"

[profile.release]
panic = "unwind"
