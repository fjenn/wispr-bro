# SPDX-License-Identifier: GPL-3.0-or-later
# Wispr Bro for iPhone: end-to-end checks against the real app in a simulator.
# `xcodegen generate` → WBE2E.xcodeproj; run with ./run.sh.
#   WBE2EHost   a tiny "other app" with a text field (own bundle id and URL
#               scheme), the place the keyboard types into.
#   WBE2ETests  XCUITests that drive that host, the Wispr Bro keyboard and the
#               installed Wispr Bro app (com.wisprbro.ios).
name: WBE2E
options:
  bundleIdPrefix: com.wisprbro.e2e
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 446XT9839S
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
targets:
  WBE2EHost:
    type: application
    platform: iOS
    sources: [Host]
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Notepad
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.wisprbro.e2e.host
            CFBundleURLSchemes: [wbe2ehost]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wisprbro.e2e.host
    scheme:
      testTargets: [WBE2ETests]
  WBE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WBE2EHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wisprbro.e2e.tests
        TEST_TARGET_NAME: WBE2EHost
