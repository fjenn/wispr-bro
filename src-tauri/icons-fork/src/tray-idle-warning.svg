<!-- Wispr Bro PLACEHOLDER tray glyph: idle with a warning badge (shortcuts blocked). -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="48" cy="46" r="15" fill="#000"/>
    </mask>
    <mask id="badge">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="46" y="36" width="4" height="12" rx="2" fill="#000"/>
      <circle cx="48" cy="53" r="2.4" fill="#000"/>
    </mask>
  </defs>
  <g fill="#000000" mask="url(#cut)">
    <rect x="5" y="24" width="6" height="16" rx="3"/>
    <rect x="15" y="17" width="6" height="30" rx="3"/>
    <rect x="25" y="11" width="6" height="42" rx="3"/>
    <rect x="35" y="19" width="6" height="26" rx="3"/>
    <rect x="45" y="25" width="6" height="14" rx="3"/>
  </g>
  <circle cx="48" cy="46" r="12" fill="#000000" mask="url(#badge)"/>
</svg>
