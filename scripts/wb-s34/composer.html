<!--
  Mac test S-34: a chat composer stand-in (Slack is not installed on the
  test Mac). Made-up people only. Return sends (the composer empties and the
  message joins the thread), Shift+Return adds a line, as in Slack. The
  composer starts with a private sentinel ("door code 4471") that must
  never reach Wispr Bro's database or log. #card focuses a "Card number"
  field instead (a sensitive field: never watched). The page title mirrors
  the composer ("S34:<text>") and, after a send, the sent message
  ("S34 sent:<text>"), so the driver reads it through the window title.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>S34 composer</title>
    <style>
      body {
        font:
          14px -apple-system,
          sans-serif;
        margin: 0;
        display: flex;
        height: 100vh;
      }
      nav {
        width: 180px;
        background: #3f0e40;
        color: #fff;
        padding: 12px;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .msg {
        padding: 8px 16px;
      }
      textarea,
      input {
        margin: 12px 16px;
        font: inherit;
        padding: 8px;
      }
      textarea {
        height: 80px;
      }
    </style>
  </head>
  <body>
    <nav>
      <div>Channels</div>
      <div># launch-plan</div>
    </nav>
    <main>
      <h1 style="font-size: 16px; padding: 0 16px">Thread</h1>
      <div id="thread">
        <div class="msg">Siobhán: where do we deploy it?</div>
      </div>
      <textarea id="composer" aria-label="Reply in thread"></textarea>
    </main>
    <script>
      const isCard = location.hash === "#card";
      const composer = document.getElementById("composer");
      composer.value = "Private: door code 4471. ";
      let el = composer;
      if (isCard) {
        el = document.createElement("input");
        el.setAttribute("aria-label", "Card number");
        el.placeholder = "Card number";
        document.querySelector("main").appendChild(el);
      }
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
      let sent = null;
      const mirror = () => {
        document.title =
          sent !== null
            ? "S34 sent:" + sent
            : "S34:" + el.value.replace(/\s+/g, " ").trim();
      };
      composer.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
          e.preventDefault();
          sent = composer.value.replace(/\s+/g, " ").trim();
          const m = document.createElement("div");
          m.className = "msg";
          m.textContent = sent;
          document.getElementById("thread").appendChild(m);
          composer.value = "";
          mirror();
        }
      });
      el.addEventListener("input", mirror);
      setInterval(mirror, 200);
    </script>
  </body>
</html>
