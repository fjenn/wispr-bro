<!-- Mac test S-11.2: a chat box like Slack's (Enter sends, Shift+Enter is a
     new line). The window title reports what was sent and what is in the
     box, so scripts/wb-s11/take.sh can read it without page scripting. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>S11 chat</title>
    <style>
      body {
        font:
          15px -apple-system,
          sans-serif;
        margin: 24px;
      }
      textarea {
        width: 90%;
        height: 120px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <p>S-11 test chat box: Enter sends, Shift+Enter is a new line.</p>
    <textarea id="box" autofocus></textarea>
    <ol id="sent"></ol>
    <script>
      const box = document.getElementById("box");
      const sent = [];
      const show = () => {
        document.title =
          "S11|sent=" + sent.length + "|" + encodeURIComponent(box.value);
      };
      box.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sent.push(box.value);
          const li = document.createElement("li");
          li.textContent = box.value;
          document.getElementById("sent").appendChild(li);
          box.value = "";
        }
        setTimeout(show, 0);
      });
      box.addEventListener("input", show);
      window.addEventListener("load", () => {
        box.focus();
        show();
      });
    </script>
  </body>
</html>
