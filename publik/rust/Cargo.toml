# SPDX-License-Identifier: GPL-3.0-or-later
# The publik edition's Rust code (../README.md). src-tauri pulls it in only
# with its `publik` Cargo feature, so the normal Wispr Bro never compiles it.
[package]
name = "wb-publik"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
chrono = "0.4"
log = "0.4.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", default-features = false }
tauri-plugin-opener = "2.5.2"
