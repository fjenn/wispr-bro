# SPDX-License-Identifier: GPL-3.0-or-later
#
# Wispr Bro macOS build (F-02, R5 §6 F-02): build, sign with the Developer ID,
# notarize, staple, updater archive + signature, DMG, latest.json, then
# wb-verify on a fresh runner. Called by wb-release.yml; run by hand
# (workflow_dispatch) for a dry run.
#
# One path for CI and the owner's Mac: every step is
# scripts/wb-release/macos.sh (and verify.sh), which F-02 ran end to end on
# this Mac with the real identity. tauri-action is not used: it can neither
# staple the DMG (RS-12) nor fill the rolling beta release, and the Tauri CLI
# it wraps is what macos.sh calls.
#
# Matrix: aarch64 (Apple Silicon) and x86_64 (Intel), both on macos-26 Apple
# Silicon runners. The Intel app and its sidecar are cross-compiled
# (macos.sh --arch x86_64); their checks and smoke test run under Rosetta 2.
# Each arch uploads wb-release-macos-<arch>; wb-release.yml merges them into
# one release and one latest.json.
#
# Editions (docs/fork/EDITIONS.md): the normal Wispr Bro always builds, as
# `wb-release-macos-<arch>` with the same asset names as ever. With
# `publik: true` the publik edition also builds for each arch, in its own
# jobs, as `wb-release-macos-<arch>-publik` (Wispr-Bro-publik_* assets,
# latest-publik.json, SHA256SUMS-publik). Off by default.
#
# Signing never runs on sync or feature branches: a signed build needs the
# `wispr-bro` branch or a `v*` tag; any other ref only gets the unsigned dry
# run (`signed: false`, no secrets used).
#
# Secrets (docs/fork/RELEASING.md "Secrets"): APPLE_CERTIFICATE,
# APPLE_CERTIFICATE_PASSWORD, APPLE_API_KEY_ID, APPLE_API_ISSUER,
# APPLE_API_KEY_P8, TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

name: "wb-build"

on:
  workflow_call:
    inputs:
      tag:
        description: "release tag (vX.Y.Z[-alpha|beta|rc.N]); default v<overlay version>"
        type: string
        required: false
        default: ""
      signed:
        type: boolean
        required: false
        default: true
      publik:
        description: "also build the publik edition (docs/fork/EDITIONS.md)"
        type: boolean
        required: false
        default: false
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
      APPLE_API_KEY_P8:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      signed:
        description: "sign + notarize (wispr-bro branch or a v* tag only)"
        type: boolean
        default: false
      tag:
        description: "release tag; default v<overlay version>"
        type: string
        default: ""
      publik:
        description: "also build the publik edition (docs/fork/EDITIONS.md)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build macOS ${{ matrix.arch }}${{ matrix.edition == 'publik' && ' (publik)' || '' }}
    if: ${{ !inputs.signed || github.ref == 'refs/heads/wispr-bro' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        edition: ${{ fromJSON(inputs.publik && '["standard","publik"]' || '["standard"]') }}
    env:
      SIGNED: ${{ inputs.signed && '1' || '0' }}
      TAG: ${{ inputs.tag }}
      EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Rosetta 2 (runs the Intel sidecar and app checks)
        if: ${{ matrix.arch == 'x86_64' }}
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.arch == 'aarch64' && 'wb-build-release' || 'wb-build-release-x86_64' }}${{ matrix.edition == 'publik' && '-publik' || '' }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Import the Developer ID certificate (temporary keychain)
        if: ${{ inputs.signed }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" || { echo "::error::secret APPLE_CERTIFICATE is not set"; exit 1; }
          kc="$RUNNER_TEMP/wb-signing.keychain-db"
          kp="$(openssl rand -hex 24)"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kp" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one existing keychain path per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application: Finn Jennen (446XT9839S)" \
            || { echo "::error::the certificate is not our Developer ID Application identity"; exit 1; }
          echo "WB_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: Notary API key
        if: ${{ inputs.signed }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_P8" || { echo "::error::secret APPLE_API_KEY_P8 is not set"; exit 1; }
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          chmod 600 "$key"
          {
            echo "WB_NOTARY_KEY_PATH=$key"
            echo "WB_NOTARY_KEY_ID=$APPLE_API_KEY_ID"
            echo "WB_NOTARY_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple (scripts/wb-release/macos.sh)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(--out release-out --arch "${{ matrix.arch }}" --edition "$EDITION")
          [ -n "$TAG" ] && args+=(--tag "$TAG")
          [ "$SIGNED" = 1 ] || args+=(--unsigned)
          scripts/wb-release/macos.sh "${args[@]}"

      - name: Upload release artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wb-release-macos-${{ matrix.arch }}${{ matrix.edition == 'publik' && '-publik' || '' }}
          path: release-out/
          retention-days: 14

      - name: Remove the keychain and API key
        if: ${{ always() }}
        run: |
          [ -n "${WB_KEYCHAIN:-}" ] && security delete-keychain "$WB_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  verify:
    name: wb-verify ${{ matrix.arch }} (fresh runner)${{ matrix.edition == 'publik' && ' (publik)' || '' }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
        edition: ${{ fromJSON(inputs.publik && '["standard","publik"]' || '["standard"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rosetta 2 (Intel smoke test)
        if: ${{ matrix.arch == 'x86_64' }}
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license

      - uses: actions/download-artifact@v4
        with:
          name: wb-release-macos-${{ matrix.arch }}${{ matrix.edition == 'publik' && '-publik' || '' }}
          path: release-out

      - name: codesign, Gatekeeper, stapler, updater signature, --list-devices
        env:
          SIGNED: ${{ inputs.signed && '1' || '0' }}
          SUMS: ${{ matrix.edition == 'publik' && 'SHA256SUMS-publik' || 'SHA256SUMS' }}
        run: |
          set -euo pipefail
          dmg="$(ls release-out/*.dmg)"
          if [ "$SIGNED" = 1 ]; then
            scripts/wb-release/verify.sh --dmg "$dmg" --updater "$(ls release-out/*.app.tar.gz)"
            (cd release-out && shasum -a 256 -c "$SUMS")
          else
            scripts/wb-release/verify.sh --dmg "$dmg" --unsigned
          fi
